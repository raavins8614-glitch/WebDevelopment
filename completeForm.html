<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Form</title>
</head>

<body>
    <form action="">
        <!-- Name -->
        <h3>Registration Form</h3>
        <label for="name">Name: </label> <br>
        <input type="text" name="name" id="name"> <br><br>
        <label for="email">Email: </label> <br>
        <input type="email" name="email" id="email"><br><br>
        <label for="password">Password: </label> <br>
        <input type="password" name="password" id="password"><br><br>
        <label for="confirmPassword">Confirm Password: </label> <br>
        <input type="confirmPassword" name="confirmPassword" id="confirmPassword"><br><br>
        <label for="message">Message:</label> <br>
        <textarea name="message" id="message" rows="10" cols="40"></textarea> <br><br>

        <!-- Radio Button -->

        <p>Gender: </p>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>

        <br><br>
        <!-- Checkboxes -->
        <p>Subjects:</p>
        <input type="checkbox" id="english" name="english">
        <label for="english">English</label>

        <input type="checkbox" name="maths" id="maths">
        <label for="maths">Maths</label>

        <input type="checkbox" name="coding" id="coding">
        <label for="coding">Coding</label> <br><br>


        <!-- DOB - Date-Calendar -->
        <label for="age">Date of Birth:</label>
        <input type="date" id="age" name="age">

        <br><br>

        <label for="exp">Experience:</label>
        <input type="range" name="exp" id="exp">
        <br><br>


        <label for="rNum">Roll Number: </label> <br>
        <input type="number" name="rNum" id="rNum">


        <br><br>

        <input type="button" value="Submit">

    </form>
</body>

</html>
